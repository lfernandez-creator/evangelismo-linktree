<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Linktree</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020C25;
            --bg-light: #0E3770;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.2);
            --accent-color: #00d4ff; /* Un azul claro para resaltar los días */
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .container-custom {
            max-width: 450px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeDown 0.8s ease forwards;
        }

   .schedule-box {
    background: transparent;
    border: 1px solid var(--accent-color);
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); /* Brillo suave */
    border-radius: 20px;
    padding: 15px;
    margin-bottom: 25px;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.5s;
}

.schedule-title {
    background: var(--accent-color);
    color: var(--bg-dark) !important;
    padding: 2px 10px;
    border-radius: 5px;
    display: inline-block;
}

        .schedule-item {
            font-size: 1rem;
            margin: 5px 0;
            font-weight: 400;
        }

        .schedule-item strong {
            font-weight: 600;
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .link-card:hover {
            background: var(--card-hover);
            transform: scale(1.05);
            color: #fff;
        }

        .address-link {
                display: block;
                font-size: 0.85rem;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                color: #cbd5e1;
                text-decoration: none; /* Quitamos el subrayado por defecto */
                transition: 0.3s;
            }

            .address-link:hover {
                color: var(--accent-color); /* Cambia al color celeste al pasar el mouse */
                transform: translateY(-2px);
            }

            .address-link i {
                margin-right: 5px;
            }
        footer {
            margin-top: 40px;
            padding-bottom: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            width: 100%;
        }
        /* Ajuste de delays para que todo fluya con el nuevo div */
        .link-card:nth-of-type(1) { animation: fadeUp 0.5s ease forwards; animation-delay: 0.8s; }
        .link-card:nth-of-type(2) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.0s; }
        .link-card:nth-of-type(3) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.2s; }
        .link-card:nth-of-type(4) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.4s; }
        .link-card:nth-of-type(5) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.6s; }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container-custom">
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAADT" alt="Logo" class="logo">

<div class="schedule-box position-relative border border-secondary-subtle rounded-4 p-3 mb-4">
    <span class="badge rounded-pill bg-info text-dark position-absolute top-0 start-50 translate-middle">
        HORARIOS
    </span>
    <div class="mt-2">
        <p class="m-0 small"><strong>Dom:</strong> 11:00 AM | <strong>Mie:</strong> 7:30 PM</p>
        <a href="URL_MAPS" class="address-link border-0 p-0 m-0 mt-2" style="font-size: 0.75rem;">
             <i class="bi bi-geo-alt"></i> Ver ubicación
        </a>
    </div>
</div>

    <a href="#" class="link-card">
        <i class="bi bi-whatsapp"></i>
        <span>Comunícate con nosotros</span>
    </a>

    <a href="#" class="link-card">
        <i class="bi bi-instagram"></i>
        <span>Revisa nuestras historias</span>
    </a>

    <a href="#" class="link-card">
        <i class="bi bi-tiktok"></i>
        <span>Síguenos en TikTok</span>
    </a>

    <a href="#" class="link-card">
        <i class="bi bi-facebook"></i>
        <span>Visita nuestro Facebook</span>
    </a>

    <a href="#" class="link-card">
        <i class="bi bi-globe"></i>
        <span>Ir a nuestra web</span>
    </a>

    <footer>
        <p>© 2026 Nombre de tu Empresa. Todos los derechos reservados.</p>
    </footer>
</div>

</body>
</html>
