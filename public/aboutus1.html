<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Linktree</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020C25;
            --bg-light: #0E3770;
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.2);
            --accent-color: #00d4ff; /* Un azul claro para resaltar los días */
        }

        body {
            background: linear-gradient(170deg, var(--bg-light), var(--bg-dark));
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .container-custom {
            max-width: 450px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 200px;
            height: auto;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeDown 0.8s ease forwards;
        }

        .schedule-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            animation-delay: 0.5s;
        }

        .schedule-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
            color: var(--accent-color);
        }

        .schedule-item {
            font-size: 1rem;
            margin: 5px 0;
            font-weight: 400;
        }

        .schedule-item strong {
            font-weight: 600;
        }

        .link-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .link-card:hover {
            background: var(--card-hover);
            transform: scale(1.05);
            color: #fff;
        }

        .address-link {
            display: block;
            font-size: 0.85rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            text-decoration: none; 
            transition: 0.3s;
        }

        .address-link:hover {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .address-link i {
            margin-right: 5px;
        }
        footer {
            
            padding-bottom: 20px 0;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            width: 100%;
            margin-top: auto;
        }
        .link-card:nth-of-type(1) { animation: fadeUp 0.5s ease forwards; animation-delay: 0.8s; }
        .link-card:nth-of-type(2) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.0s; }
        .link-card:nth-of-type(3) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.2s; }
        .link-card:nth-of-type(4) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.4s; }
        .link-card:nth-of-type(5) { animation: fadeUp 0.5s ease forwards; animation-delay: 1.6s; }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
