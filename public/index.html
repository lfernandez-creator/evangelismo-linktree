<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Linktree</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .link-button {
            display: block;
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            transition: all 0.3s ease;
        }

        .link-button:hover {
            background-color: #007bff;
            border-color: #007bff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mis Enlaces</h1>
        <a href="aboutus1.html" class="link-button">Sobre Nosotros - Opción 1</a>
        <a href="aboutus2.html" class="link-button">Sobre Nosotros - Opción 2</a>
    </div>
</body>
</html>
